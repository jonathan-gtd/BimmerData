# BimmerData -> Telegraf -> TimescaleDB
#
# The phone posts line protocol (one point per line, original sample times) to the
# influxdb_v2_listener input below; the postgresql output writes the points to TimescaleDB.
# Line protocol is only the wire format: no InfluxDB is involved.
#
# Environment variables:
#   BIMMERDATA_TOKEN  token the phone sends (BimmerData › Settings › Telegraf export › Token)
#   PG_CONNECTION     PostgreSQL connection string, e.g.
#                     "host=timescaledb user=telegraf password=secret dbname=bimmerdata sslmode=disable"

[agent]
  omit_hostname = true
  flush_interval = "5s"
  metric_batch_size = 5000
  # Memory buffer (Telegraf's default): once Telegraf answered 204 to the phone (and the phone
  # deleted its copy), the points wait in memory until the next flush (every 10 s) into
  # TimescaleDB, and are written at a normal stop. Room for a database outage of a few hours
  # of driving (about 1 KB of memory per point).
  metric_buffer_limit = 1000000
  # Optional disk buffer: the points also survive a crash or a restart while the database is
  # down. Telegraf 1.40 syncs EVERY point to disk, once per output that receives it (several
  # ms each on an SSD): about 100-200 points/s at most, so uploads get slower (the app then
  # sends smaller batches). Raise the listener timeouts below if you turn it on.
  # buffer_strategy = "disk"
  # buffer_directory = "/var/lib/telegraf/buffer"   # persistent, writable by telegraf

# Receives POST /api/v2/write with "Authorization: Token <token>".
# For HTTPS, set tls_cert / tls_key (or put a reverse proxy in front).
[[inputs.influxdb_v2_listener]]
  service_address = ":8186"
  token = "${BIMMERDATA_TOKEN}"
  # A batch must be read and buffered within these (default 10 s each); behind a reverse proxy
  # a longer request ends as 502 / 504, and the app retries with smaller batches.
  # read_timeout = "10s"
  # write_timeout = "10s"
  max_body_size = "32MB"
  # tls_cert = "/etc/telegraf/cert.pem"
  # tls_key = "/etc/telegraf/key.pem"

# Alternative with HTTP basic auth instead of a token (BimmerData: authentication "User and password",
# URL http://server:8080/telegraf):
# [[inputs.http_listener_v2]]
#   service_address = ":8080"
#   paths = ["/telegraf"]
#   methods = ["POST"]
#   data_format = "influx"
#   basic_username = "bimmerdata"
#   basic_password = "${BIMMERDATA_PASSWORD}"

[[outputs.postgresql]]
  connection = "${PG_CONNECTION}"
  # If the database is down when Telegraf starts, start anyway (the phone can still send) and
  # keep trying to connect; the points wait in the buffer meanwhile.
  startup_error_behavior = "retry"
  namepass = ["bimmerdata"]
  timestamp_column_type = "timestamp with time zone"
  # Creates the table as a TimescaleDB hypertable on the first point (see timescaledb.sql to do it by hand).
  create_templates = [
    '''CREATE TABLE {{ .table }} ({{ .columns }})''',
    '''SELECT create_hypertable({{ .table|quoteLiteral }}, by_range('time', INTERVAL '7 days'), if_not_exists => true)''',
  ]
